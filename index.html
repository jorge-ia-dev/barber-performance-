
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b0a">
<title>Barber Performance</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">



<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  background:#090b0a;
  color:#f5f5f5;
  font-family:'Rajdhani',sans-serif;
  font-size:18px;
}

h1,h2,h3,button,.resultado{
  font-family:'Orbitron',sans-serif;
}

h1{
  color:#a5ff75;
  font-size:25px;
  letter-spacing:2px;
  text-shadow:0 0 15px #a5ff7540;
}

h3{
  color:#a5ff75;
  font-size:15px;
  letter-spacing:1px;
}

p{margin:10px 0}

.card{
  background:#171b19;
  padding:18px;
  border:1px solid #292f2b;
  border-radius:16px;
  margin:18px 0;
  box-shadow:0 5px 20px #00000035;
}

input,select,button{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:9px;
  font-size:17px;
}

input,select{
  background:#222824;
  color:white;
  border:1px solid #383e3a;
  font-family:'Rajdhani',sans-serif;
}

input:focus,select:focus{
  outline:none;
  border-color:#a5ff75;
  box-shadow:0 0 8px #a5ff7530;
}

button{
  background:#a5ff75;
  color:#101510;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  border:0;
  cursor:pointer;
  transition:.2s;
}

button:active{transform:scale(.98)}

small{color:#a5ff75}

.resultado{
  font-size:23px;
  font-weight:bold;
  margin-top:8px;
  color:#a5ff75;
  overflow-wrap:anywhere;
}

label{
  display:block;
  margin-top:12px;
  color:#c4cec7;
  font-weight:600;
}

.item{
  border-bottom:1px solid #383e3a;
  padding:14px 0;
  line-height:1.6;
}

#mensagem{
  color:#a5ff75;
  font-weight:bold;
}

.subtitulo{
  color:#89948d;
  font-size:17px;
  letter-spacing:1px;
}
grafico-mes {
  margin: 16px 0;
  padding: 12px;
  background: #111512;
  border-radius: 12px;
}

.mes-titulo {
  color: #a5ff75;
  font-weight: bold;
  margin-bottom: 8px;
}

.linha-grafico {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 7px 0;
  font-size: 14px;
}

.linha-grafico span:first-child {
  width: 48px;
  color: #c4cec7;
}

.barra-fundo {
  flex: 1;
  height: 10px;
  background: #292f2b;
  border-radius: 10px;
  overflow: hidden;
}

.barra {
  height: 100%;
  border-radius: 10px;
  background: #a5ff75;
}

.barra.liquida {
  background: #53b9ff;
}

.valor-grafico {
  width: 85px;
  text-align: right;
  font-size: 13px;
}

.tabela-meses {
  overflow-x: auto;
}

.tabela-meses table {
  width: 100%;
  min-width: 440px;
  border-collapse: collapse;
  font-size: 15px;
}

.tabela-meses th,
.tabela-meses td {
  padding: 10px 7px;
  text-align: left;
  border-bottom: 1px solid #383e3a;
}

.tabela-meses th {
  color: #a5ff75;
}
</style>
</head>

<body>

<h1>BARBER PERFORMANCE</h1>
<p class="subtitulo">SEU DESEMPENHO. SEUS RESULTADOS.</p>

<div class="card">
<h3>NOVO ATENDIMENTO</h3>

<label>Data</label>
<input type="date" id="data">

<label>Serviço</label>
<select id="servico">
<option value="cabelo">Cabelo</option>
<option value="barba">Barba</option>
<option value="ambos">Cabelo + Barba</option>
</select>

<label>Valor do cabelo (R$)</label>
<input type="number" id="cabelo" value="35" min="0" step="0.01">

<label>Valor da barba (R$)</label>
<input type="number" id="barba" value="25" min="0" step="0.01">

<label>Desconto total (R$)</label>
<input type="number" id="desconto" value="0" min="0" step="0.01">

<button onclick="salvar()">SALVAR ATENDIMENTO</button>
<p id="mensagem"></p>
</div>

<div class="card">
<h3>SEU PAINEL</h3>

<label>Período</label>
<select id="periodo" onchange="atualizar()">
<option value="7">Últimos 7 dias</option>
<option value="15">Últimos 15 dias</option>
<option value="30" selected>Últimos 30 dias</option>
</select>

<p>Atendimentos</p>
<div class="resultado" id="totalAtendimentos">0</div>

<p>Faturamento líquido</p>
<div class="resultado" id="faturamento">R$ 0,00</div>

<p>Sua comissão (50%)</p>
<div class="resultado" id="comissao">R$ 0,00</div>
</div>

<div class="card">
<h3>HISTÓRICO</h3>
<div id="historico">Nenhum atendimento registrado.</div>
</div>

<script>
const chave = "barber_performance_v1";
let registros = [];

try {
  registros = JSON.parse(localStorage.getItem(chave) || "[]");
  if (!Array.isArray(registros)) registros = [];
} catch(e) {
  registros = [];
}

document.getElementById("data").value =
  new Date().toLocaleDateString("en-CA");

function dinheiro(valor) {
  return Number(valor).toLocaleString("pt-BR", {
    style:"currency",
    currency:"BRL"
  });
}


function salvar() {
  const data = document.getElementById("data").value;
  const servico = document.getElementById("servico").value;

  const valorCabelo = Number(document.getElementById("cabelo").value) || 0;
  const valorBarba = Number(document.getElementById("barba").value) || 0;
  const desconto = Number(document.getElementById("desconto").value) || 0;

  if (!data) {
    alert("Informe a data.");
    return;
  }

  let cabelo = 0;
  let barba = 0;

  if (servico === "cabelo") {
    cabelo = valorCabelo;
  } else if (servico === "barba") {
    barba = valorBarba;
  } else if (servico === "ambos") {
    cabelo = valorCabelo;
    barba = valorBarba;
  } else {
    alert("Selecione um serviço válido.");
    return;
  }

  const bruto = cabelo + barba;

  if (bruto <= 0 || desconto < 0 || desconto > bruto) {
    alert("Confira os valores e o desconto.");
    return;
  }

  const liquido = bruto - desconto;
  const comissao = liquido * 0.5;

  const atendimento = {
    id: Date.now(),
    data: data,
    servico: servico,
    cabelo: cabelo,
    barba: barba,
    desconto: desconto,
    liquido: liquido,
    comissao: comissao
  };

  try {
    registros.push(atendimento);
    localStorage.setItem(chave, JSON.stringify(registros));

    document.getElementById("mensagem").textContent =
      "Atendimento salvo com sucesso!";

    document.getElementById("desconto").value = 0;

    atualizar();

  } catch (e) {
    registros.pop();
    alert("Erro ao salvar. Verifique o armazenamento do navegador.");
  }
}



function atualizar() {
  const dias = Number(document.getElementById("periodo").value);

  const limite = new Date();
  limite.setHours(0,0,0,0);
  limite.setDate(limite.getDate() - (dias - 1));

  const lista = registros.filter(r => {
    const d = new Date(r.data + "T00:00:00");
    return d >= limite && d <= new Date();
  });

  const soma = lista.reduce((a,r) => a + Number(r.liquido), 0);
  const comissao = soma * 0.5;

  document.getElementById("totalAtendimentos").textContent = lista.length;
  document.getElementById("faturamento").textContent = dinheiro(soma);
  document.getElementById("comissao").textContent = dinheiro(comissao);

  const historico = document.getElementById("historico");

  if (!registros.length) {
    historico.textContent = "Nenhum atendimento registrado.";
    return;
  }

  historico.innerHTML = [...registros].reverse().map(r => `
    <div class="item">
      <strong>${r.data.split("-").reverse().join("/")}</strong><br>
      ${r.servico === "ambos" ? "Cabelo + Barba" :
        r.servico === "cabelo" ? "Cabelo" : "Barba"}<br>
      Líquido: ${dinheiro(r.liquido)}<br>
      Sua comissão: <small>${dinheiro(r.comissao)}</small><br>
      <button onclick="excluir(${r.id})">EXCLUIR</button>
    </div>
  `).join("");
}

function excluir(id) {
  if (!confirm("Deseja excluir este atendimento?")) return;

  registros = registros.filter(r => r.id !== id);

  localStorage.setItem(chave, JSON.stringify(registros));

  atualizar();
}

atualizar();
</script>

</body>
</html>
